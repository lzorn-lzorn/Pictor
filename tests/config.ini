; ============================================================
; 应用配置文件 app.ini
; 注释以分号 (;) 或井号 (#) 开头
; ============================================================

[General]
app_name = HelloVulkan
version = 1.2.0
build = 20261118
debug = false
language = zh-CN

[Window]
title = Hello Vulkan
width = 1280
height = 720
fullscreen = false
resizable = true

[Graphics]
backend = vulkan
vsync = true
msaa = 4
max_fps = 144
preferred_gpu = 0

[Renderer]
shadow_quality = high
texture_filter = anisotropic
anisotropy_level = 16
render_scale = 1.0

[Audio]
master_volume = 0.8
music_volume = 0.6
sfx_volume = 1.0
mute = false

[Paths]
; 相对路径基于可执行文件所在目录
asset_dir = ./assets
shader_dir = ./shaders
log_dir = ./logs
save_dir = ./saves

[Logging]
level = info
; 可选: trace, debug, info, warn, error, fatal
console = true
file = true
max_file_size_mb = 50
rotate_count = 3

[Network]
host = 127.0.0.1
port = 8080
timeout_seconds = 30
reconnect = true

[KeyBindings]
forward = W
backward = S
left = A
right = D
jump = Space
crouch = Ctrl
sprint = Shift

; 带分号的转义示例
; 值中的分号若需保留，部分解析器要求引号包裹：
motto = "Stay hungry; stay foolish"

[Advanced]
; 整数
worker_threads = 8
; 浮点数
time_scale = 1.0
; 布尔
enable_validation = true
; 空值（合法写法：等号后留空）
custom_flag =